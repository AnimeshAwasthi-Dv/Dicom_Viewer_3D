services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Tenants file for several products on one viewer: config/tenants.json, TENANTS_FILE=/app/config/tenants.json.
    volumes:
      - ./config:/app/config:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config:/app/config:ro
    command: ["node", "server-dist/worker.js"]
    stop_grace_period: 5m
