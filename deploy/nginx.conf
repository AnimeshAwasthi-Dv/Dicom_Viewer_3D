# Install after provisioning a TLS certificate for dicom.admindectrocel.online.
# This template assumes nginx and the Docker-published API port run on the same host.
server {
    listen 80;
    server_name dicom.admindectrocel.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dicom.admindectrocel.online;
    ssl_certificate /etc/letsencrypt/live/dicom.admindectrocel.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dicom.admindectrocel.online/privkey.pem;
    client_max_body_size 1m;

    location /api/viewer/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Folder imports can issue many bounded HEAD requests before queuing.
        proxy_read_timeout 300s;
    }
}
